name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Type-check edge worker
        run: npm run typecheck:worker
      - name: Build SPA
        run: npm run build
        env:
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      # Fallback origin (Apache, uses .htaccess for SPA routing)
      - name: Deploy SPA to origin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: './dist/'
      # Edge worker + static assets on meteostat.net
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
